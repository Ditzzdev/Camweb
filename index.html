<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamStudy | Final Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --primary: #6366f1;
            --accent: #a855f7;
            --bg-start: #0f172a;
            --bg-end: #1e1b4b;
            --success: #22c55e;
            --warning: #fbbf24;
            --error: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: white;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; overflow: hidden;
        }

        .blob {
            position: absolute; width: 400px; height: 400px;
            background: var(--primary); filter: blur(100px);
            border-radius: 50%; z-index: -1; opacity: 0.4;
            animation: moveBlob 15s infinite alternate;
        }
        @keyframes moveBlob { from { transform: translate(-30%, -30%); } to { transform: translate(30%, 30%); } }

        /* Nav Kapsul Logic */
        .capsule-nav {
            position: fixed; top: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 10px 22px; border-radius: 30px;
            color: white; font-size: 12px; font-weight: 600;
            cursor: pointer; z-index: 50; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-right { right: 20px; } /* Untuk Admin Dash */
        .nav-left { left: 20px; }   /* Untuk Back to User */
        .capsule-nav:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

        /* Card System */
        .view { display: none; width: 100%; max-width: 400px; animation: scaleUp 0.4s ease forwards; }
        .active-view { display: block; }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px; padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center;
        }

        /* Video System */
        .video-container {
            width: 100%; height: 260px;
            background: rgba(0,0,0,0.4); border-radius: 24px;
            overflow: hidden; border: 1px solid var(--glass-border);
            position: relative; margin-bottom: 10px;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .mirror { transform: scaleX(-1); }

        /* Text Status di Bawah Kamera */
        .status-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 20px; transition: 0.3s;
        }

        /* Forms & Buttons */
        input {
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            padding: 16px; border-radius: 16px; color: white; margin-bottom: 15px; outline: none;
        }
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            font-weight: 600; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-glass { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border); }

        /* Custom Modal & Alert */
        #login-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            z-index: 100; display: none; justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(20, 20, 20, 0.8); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 35px; width: 90%; max-width: 320px; text-align: center;
        }
        #error-msg { color: var(--error); font-size: 12px; margin-top: -10px; margin-bottom: 15px; display: none; }
        
        /* Shake Animation for Wrong Password */
        .shake { animation: shakeAnim 0.4s ease-in-out; }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

    <div class="blob"></div>

    <button class="capsule-nav nav-right" id="btn-to-admin" onclick="openLoginModal()">Admin Dash 🔒</button>
    <button class="capsule-nav nav-left" id="btn-to-user" style="display:none;" onclick="showView('user')">← Back to User</button>

    <div id="login-modal">
        <div class="modal-content" id="modal-box">
            <h3 style="margin-bottom: 20px; color: var(--accent);">Admin Access</h3>
            <input type="password" id="admin-password" placeholder="Enter Password">
            <div id="error-msg">❌ Password salah, coba lagi!</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-glass" onclick="closeLoginModal()">Batal</button>
                <button class="btn btn-primary" onclick="checkPassword()">Login</button>
            </div>
        </div>
    </div>

    <div id="view-user" class="view active-view">
        <div class="glass-card">
            <h2>Kamera User</h2>
            <p id="my-id" style="font-size: 10px; opacity: 0.5; margin-bottom: 20px;">Menghubungkan...</p>
            <div class="video-container">
                <video id="local-video" autoplay playsinline muted class="mirror"></video>
            </div>
            <div class="status-label" id="user-status" style="color: var(--warning);">Offline</div>
            <button class="btn btn-primary" onclick="initCamera()">📹 Aktifkan Kamera</button>
            <button class="btn btn-glass" id="btn-switch" style="display:none; margin-top:10px;" onclick="toggleCamera()">🔄 Ganti Kamera</button>
        </div>
    </div>

    <div id="view-admin" class="view">
        <div class="glass-card">
            <h2 style="color: var(--accent);">Admin Panel</h2>
            <p style="font-size: 10px; opacity: 0.5; margin-bottom: 20px;">Monitoring Mode</p>
            <input type="text" id="peer-id-input" placeholder="Masukkan ID User">
            <button class="btn btn-primary" onclick="startWatching()">👀 Mulai Pantau</button>
            <div style="margin-top: 25px;" class="video-container">
                <video id="remote-video" autoplay playsinline muted></video>
            </div>
            <div class="status-label" id="admin-status" style="color: var(--warning);">Standby</div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let localStream;
        let isFront = true;
        const peer = new Peer();
        const PASS = "ditzz11";

        peer.on('open', id => document.getElementById('my-id').innerText = "ID: " + id);

        function showView(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
            document.getElementById('view-' + view).classList.add('active-view');
            
            // Toggle Capsule Navs
            document.getElementById('btn-to-admin').style.display = (view === 'admin') ? 'none' : 'flex';
            document.getElementById('btn-to-user').style.display = (view === 'admin') ? 'flex' : 'none';
        }

        // --- Aesthetic Login Logic ---
        function openLoginModal() { 
            document.getElementById('login-modal').style.display = 'flex'; 
            document.getElementById('admin-password').focus();
        }
        function closeLoginModal() { 
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('error-msg').style.display = 'none';
        }
        function checkPassword() {
            const modalBox = document.getElementById('modal-box');
            if(document.getElementById('admin-password').value === PASS) {
                closeLoginModal();
                showView('admin');
            } else {
                // Shake & Show Error
                modalBox.classList.add('shake');
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('admin-password').value = '';
                setTimeout(() => modalBox.classList.remove('shake'), 400);
            }
        }

        // --- Camera Logic ---
        async function initCamera() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: isFront ? "user" : "environment" }, audio: true 
                });
                const v = document.getElementById('local-video');
                v.srcObject = localStream;
                v.classList.toggle('mirror', isFront);
                document.getElementById('user-status').innerText = "🟢 Kamera Aktif";
                document.getElementById('user-status').style.color = "var(--success)";
                document.getElementById('btn-switch').style.display = 'flex';
            } catch (e) { document.getElementById('user-status').innerText = "❌ Akses Ditolak"; }
        }

        function toggleCamera() { isFront = !isFront; initCamera(); }
        peer.on('call', call => { if(localStream) call.answer(localStream); });

        // --- Admin Monitor Logic ---
        function startWatching() {
            const id = document.getElementById('peer-id-input').value;
            const status = document.getElementById('admin-status');
            if(!id) return;

            status.innerText = "Menghubungkan...";
            status.style.color = "var(--warning)";
            
            const call = peer.call(id, null);
            call.on('stream', stream => {
                const rv = document.getElementById('remote-video');
                rv.srcObject = stream;
                rv.play().then(() => {
                    status.innerText = "🟢 Terhubung (Live)";
                    status.style.color = "var(--success)";
                });
            });

            setTimeout(() => {
                if(status.innerText === "Menghubungkan...") {
                    status.innerText = "❌ Gagal Menghubungkan";
                    status.style.color = "var(--error)";
                }
            }, 8000);
        }
    </script>
</body>
</html>
